<!-- index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Solana Wallet</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="light-theme">
  <div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1>⚡ Solana Wallet</h1>
      <button class="btn btn-outline-secondary" onclick="toggleTheme()"><i class="bi bi-moon-stars-fill"></i> / <i class="bi bi-sun-fill"></i></button>
    </div>

    <ul class="nav nav-tabs mb-4">
      <li class="nav-item"><a class="nav-link active" href="#upload" data-bs-toggle="tab">Загрузка</a></li>
      <li class="nav-item"><a class="nav-link" href="#balances" data-bs-toggle="tab">Балансы</a></li>
      <li class="nav-item"><a class="nav-link" href="#swap-close" data-bs-toggle="tab">Swap & Close ATA</a></li>
      <li class="nav-item"><a class="nav-link" href="#transfer" data-bs-toggle="tab">Перевод</a></li>
      <li class="nav-item"><a class="nav-link" href="#logs-tab" data-bs-toggle="tab">Логи</a></li>
    </ul>

    <div class="tab-content">
      <!-- Загрузка -->
      <div class="tab-pane fade show active" id="upload">
        <div class="row">
          <div class="col-md-6">
            <div class="card p-4 mb-4">
              <h5>Загрузить кошельки (CSV: public_key, private_key)</h5>
              <input type="file" id="walletsFile" class="form-control mb-2">
              <button class="btn btn-outline-primary" onclick="uploadWallets()">Загрузить</button>
            </div>
          </div>
          <div class="col-md-6">
            <div class="card p-4 mb-4">
              <h5>Загрузить токены (CSV: name, mint)</h5>
              <input type="file" id="tokensFile" class="form-control mb-2">
              <button class="btn btn-outline-primary" onclick="uploadTokens()">Загрузить</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Балансы -->
      <div class="tab-pane fade" id="balances">
        <div class="card p-4">
          <h5>Балансы кошельков</h5>
          <select id="walletSelect" class="form-select mb-3" onchange="showWalletBalance(this.value)"></select>
          <table class="table table-hover" id="balanceTable">
            <thead><tr><th>Токен</th><th>Баланс</th><th>ATA Open</th></tr></thead>
            <tbody></tbody>
          </table>
          <button class="btn btn-outline-secondary" onclick="refreshWallets()">Обновить</button>
        </div>
      </div>

      <!-- Swap & Close ATA -->
      <div class="tab-pane fade" id="swap-close">
        <div class="card p-4">
          <h5>Swap через Jupiter</h5>
          <select id="swapWalletSelect" class="form-select mb-2"></select>
          <select id="inputToken" class="form-select mb-2"><option>SOL</option><option>USDC</option></select>
          <select id="outputToken" class="form-select mb-2"><option>SOL</option><option>USDC</option></select>
          <input type="number" id="swapAmount" class="form-control mb-2" placeholder="Amount">
          <button class="btn btn-outline-success" onclick="performSwap()">Swap</button>
        </div>
        <div class="card p-4 mt-4">
          <h5>Close ATA</h5>
          <select id="closeWalletSelect" class="form-select mb-2"></select>
          <select id="closeToken" class="form-select mb-2"></select>
          <button class="btn btn-outline-warning" onclick="closeATA()">Close</button>
        </div>
      </div>

      <!-- Перевод -->
      <div class="tab-pane fade" id="transfer">
        <div class="card p-4">
          <h5>Перевод</h5>
          <select id="transferWalletSelect" class="form-select mb-2"></select>
          <select id="transferToken" class="form-select mb-2"><option>SOL</option><option>USDC</option></select>
          <input type="text" id="recipient" class="form-control mb-2" placeholder="Recipient Address">
          <input type="number" id="transferAmount" class="form-control mb-2" placeholder="Amount">
          <button class="btn btn-outline-primary" onclick="performTransfer()">Перевести</button>
        </div>
      </div>

      <!-- Логи -->
      <div class="tab-pane fade" id="logs-tab">
        <pre id="logs" class="border p-3" style="height: 400px; overflow-y: auto;"></pre>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/main.js"></script>
</body>
</html>
